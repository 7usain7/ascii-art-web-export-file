<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found</title>
</head>


<style>
    body {
        background-color:#463554;
        font-family: Arial, sans-serif;
        padding: 20px;
        text-align: center;
        display: flex;
        align-items: center;
        flex-direction: column;
    }

    .text {
        align-items: center;
        background-color: rgb(211, 202, 192);
        border: solid;
        border-color: white;
        border-width: 2px;
        border-radius: 4px;
        box-shadow: 0 2px 10px white;
        margin-top: 100px;
        padding: 20px;
        min-width: 600px;
    }

    #notfound {
        font-size: 30px;
    }

    #code {
        font-size: 72px;
        color: red;
    }

    a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: rgb(67, 67, 214);
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }
    a:hover {
        background-color: rgb(87, 87, 255);
    }
    
</style>


<body>
    <div class="text">
        <h1 id="code">404</h1>
        <h2 id="notfound">Page not found</h2>
        <a href="/" class="home-link">Return to Homepage</a>
    </div>
    
</body>
</html>
